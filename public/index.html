<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Battleships — Team Wars</title><link rel="stylesheet" href="/style.css?v=20261118-lock4"></head><body><header><strong>⚓ BATTLESHIPS <small>TEAM WARS</small></strong><span id="status">Connecting…</span></header><main><section id="login" class="panel"><h1>Join the fleet</h1><p>Two teams. Every move decided by majority vote.</p><form id="join"><input id="name" maxlength="24" placeholder="Player name" required><button>Join game</button></form><p id="error"></p></section><section id="dashboard" hidden><div class="topline"><h2 id="identity"></h2><strong id="turn"></strong><span id="timer"></span></div><div class="layout"><article class="panel"><h3>Your fleet <span id="instruction"></span></h3><div id="own" class="board"></div><p id="votestatus"></p><div id="fleet"></div></article><article class="panel"><h3>Enemy waters</h3><div id="enemy" class="board"></div><div class="enemy-tools"><button type="button" id="lock-mode" aria-pressed="false">🎯 VOTE MODE — click tiles to vote</button><span id="lock-status" role="status">Switch to LOCK MODE, then click or tap a pale-grey square to lock it. Click a padlock to unlock.</span></div></article><aside class="panel"><h3>Team status</h3><div id="teams"></div><h3>Your Teammates <span id="teammate-count" class="muted"></span></h3><div id="teammates" class="teammate-roster"></div><h3>Intelligence</h3><div id="intelligence" class="intel-feed" aria-live="polite"></div><h3 id="chat-title">Team chat</h3><div id="chat-messages" aria-live="polite"></div><form id="chat-form" class="chat-form"><input id="chat-input" maxlength="300" autocomplete="off" placeholder="Message your team…" aria-label="Team message" required><button type="submit">Send</button></form><p id="chat-error" role="status"></p><h3>Battle log</h3><div id="history"></div></aside></div></section></main><script src="/socket.io/socket.io.js"></script><script src="/app.js?v=20261118-lock4"></script></body></html>
